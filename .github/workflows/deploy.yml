name: Deploy

# Se despliega solo cuando el CI de main termina en verde
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en EC2 con Node.js y PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ec2-user' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/becatrack
            git fetch origin main
            git reset --hard ${{ github.event.workflow_run.head_sha }}
            npm ci
            npx prisma migrate deploy
            npx prisma db push
            npm run build
            pm2 reload becatrack --update-env || pm2 start npm --name "becatrack" -- start
            pm2 save
