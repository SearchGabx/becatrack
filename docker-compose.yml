services:
  app:
    image: ghcr.io/searchgabx/becatrack:latest
    env_file: .env
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on: [app]
    restart: unless-stopped
volumes:
  caddy_data:
